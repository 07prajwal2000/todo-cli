name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: restore
        run: dotnet restore Todo.slnx

      - name: format check
        run: dotnet format Todo.slnx --verify-no-changes --verbosity diagnostic

      - name: build
        run: dotnet build Todo.slnx --no-restore --configuration Release

      - name: test
        run: dotnet test Todo.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  publish:
    name: publish ${{ matrix.rid }}
    needs: verify
    # Binaries are release artefacts: tags and manual runs only, never every merge to main.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: todo-win-x64.exe
          - rid: linux-x64
            asset: todo-linux-x64
          - rid: osx-arm64
            asset: todo-osx-arm64
          - rid: osx-x64
            asset: todo-osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: publish single file
        run: >
          dotnet publish src/Todo.Cli/Todo.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none

      - name: assert exactly one file and rename
        run: |
          set -euo pipefail
          src="artifacts/${{ matrix.rid }}"
          found=$(find "$src" -maxdepth 1 -type f ! -name "*.xml" ! -name "*.pdb")
          count=$(printf '%s\n' "$found" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one published file, found $count:" >&2
            ls -la "$src" >&2
            exit 1
          fi
          cp "$found" "artifacts/${{ matrix.asset }}"
          chmod +x "artifacts/${{ matrix.asset }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error

  docs:
    name: docs
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: install
        working-directory: docs
        run: npm ci --include=dev

      - name: build
        working-directory: docs
        run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v4

  github-release:
    name: github release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Scope to the binary artifacts: the docs job also uploads a 'github-pages' artifact, which
      # contains a single file called artifact.tar and has no business in a GitHub release.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: todo-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
